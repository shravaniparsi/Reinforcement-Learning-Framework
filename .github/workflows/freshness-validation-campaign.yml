name: Freshness Held-Out Validation Campaign

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freshness-validation-campaign-${{ github.ref }}
  cancel-in-progress: false

jobs:
  batch-a:
    uses: ./.github/workflows/freshness-validation-batch.yml
    with:
      batch: a
  batch-b:
    needs: batch-a
    uses: ./.github/workflows/freshness-validation-batch.yml
    with:
      batch: b
  batch-c:
    needs: batch-b
    uses: ./.github/workflows/freshness-validation-batch.yml
    with:
      batch: c
  batch-d:
    needs: batch-c
    uses: ./.github/workflows/freshness-validation-batch.yml
    with:
      batch: d
  batch-e:
    needs: batch-d
    uses: ./.github/workflows/freshness-validation-batch.yml
    with:
      batch: e
  batch-f:
    needs: batch-e
    uses: ./.github/workflows/freshness-validation-batch.yml
    with:
      batch: f
