name: Freshness Clustered-Loss Precision Planning

on:
  workflow_dispatch:
  push:
    branches:
      - codex/clustered-loss-precision-run-v1

permissions:
  contents: read

concurrency:
  group: freshness-clustered-loss-precision-planning-${{ github.ref }}
  cancel-in-progress: false

jobs:
  precision-blocks:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        workload:
          - mutable-product-v1
          - svelte-realworld-feed-v1
          - react-admin-dashboard-v1
        regime: [read-heavy, balanced, write-intensive]
        transport: [redis-pubsub, redis-streams]
        seed: [2100, 2101, 2102, 2103, 2104, 2105, 2106, 2107, 2108, 2109]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.9.25'
      - name: Install the calibrated Redis package
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            redis-server=5:7.0.15-1ubuntu0.24.04.5 \
            redis-tools=5:7.0.15-1ubuntu0.24.04.5
      - name: Verify extension and inherited contracts
        run: |
          python -m unittest \
            tests.test_freshness_clustered_loss_design \
            tests.test_freshness_clustered_loss_measurement \
            tests.test_freshness_trace_generator \
            tests.test_freshness_trace_runner \
            tests.test_freshness_locked_execution \
            tests.test_freshness_measurement
      - name: Run matched fault profiles with four frozen policies
        shell: bash
        run: |
          set -euo pipefail
          for profile in no-fault dispersed-10 single-burst-10 repeated-bursts-10; do
            output="ci-artifacts/${{ matrix.workload }}-${{ matrix.regime }}-${{ matrix.transport }}-${{ matrix.seed }}/${profile}"
            python -m experiments.freshness.run_clustered_loss_block \
              "$output" \
              --stage extension-precision-planning \
              --workload "${{ matrix.workload }}" \
              --regime "${{ matrix.regime }}" \
              --fault-profile "$profile" \
              --transport "${{ matrix.transport }}" \
              --seed "${{ matrix.seed }}"
          done
      - name: Upload retained precision-planning blocks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clustered-loss-precision-${{ matrix.workload }}-${{ matrix.regime }}-${{ matrix.transport }}-${{ matrix.seed }}-${{ github.run_id }}
          path: ci-artifacts/
          compression-level: 9
          retention-days: 60
          if-no-files-found: error
