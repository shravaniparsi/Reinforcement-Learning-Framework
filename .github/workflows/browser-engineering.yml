name: Linux Browser Engineering

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: browser-engineering-${{ github.ref }}
  cancel-in-progress: false

jobs:
  engineering:
    # Standard hosted Linux is free for this public repository; no paid/private fallback.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      PYTHONUNBUFFERED: '1'
      RUN_DIR: ${{ github.workspace }}/ci-artifacts/browser-engineering-${{ github.run_id }}-${{ github.run_attempt }}
      CHROME_VERSION: '154.0.8037.57'
      CHROME_SHA256: ceee2972074d441ea7c4ba8bcc0eaab77e7e87680f6653d73d3065851fe10302
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.19.6'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.9.25'
      - name: Create diagnostics directory
        run: mkdir -p "$RUN_DIR"
      - name: Install locked browser dependencies
        run: |
          python -m pip install -r experiments/ci_engineering/requirements.lock.txt
          python -m playwright install-deps chromium
          corepack enable
          corepack prepare pnpm@10.20.0 --activate
          npm ci --no-audit --no-fund
      - name: Install exact Chrome for Testing archive
        shell: bash
        run: |
          curl --fail --location --retry 2 "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VERSION/linux64/chrome-linux64.zip" -o "$RUNNER_TEMP/chrome.zip"
          echo "$CHROME_SHA256  $RUNNER_TEMP/chrome.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/chrome.zip" -d "$RUNNER_TEMP/pinned-chrome"
          echo "CHROME_PATH=$RUNNER_TEMP/pinned-chrome/chrome-linux64/chrome" >> "$GITHUB_ENV"
          echo "$CHROME_SHA256" > "$RUN_DIR/chrome-archive.sha256"
      - name: Verify engineering failure gates
        run: python -m unittest discover -s tests -p test_ci_engineering.py -v
      - name: Build clean production fixtures
        run: python experiments/ci_engineering/run.py prepare --output "$RUN_DIR"
      - name: Validate all 72 application/action/CPU/cache observations
        run: python experiments/ci_engineering/run.py check --output "$RUN_DIR" --chrome "$CHROME_PATH"
      - name: Retain diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-engineering-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RUN_DIR }}/
          retention-days: 14
          if-no-files-found: warn
      - name: Describe evidence status
        if: always()
        run: |
          echo 'Engineering checks only. No fitting, test-cohort collection or policy comparison.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Inspect engineering-manifest.json for pass/fail; partial and failed observations remain in the artifact.' >> "$GITHUB_STEP_SUMMARY"
