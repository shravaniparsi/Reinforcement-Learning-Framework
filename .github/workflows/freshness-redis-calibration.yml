name: Freshness Redis Calibration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freshness-redis-calibration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  calibration:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        replicate: [0, 1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.9.25'
      - name: Install Redis from the runner distribution
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            redis-server=5:7.0.15-1ubuntu0.24.04.5 \
            redis-tools=5:7.0.15-1ubuntu0.24.04.5
          redis-server --version
      - name: Verify calibration and gateway contracts
        run: |
          python -m unittest \
            tests.test_freshness_redis_calibration \
            tests.test_freshness_contracts \
            tests.test_freshness_cache_gateway \
            tests.test_freshness_trace_runner
      - name: Collect one no-fault transport replicate
        run: |
          python -m experiments.freshness.redis_calibration \
            "ci-artifacts/freshness-redis-${{ github.run_id }}-${{ matrix.replicate }}/results.json" \
            --warmup 200 \
            --samples 5000
      - name: Upload raw calibration artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: freshness-redis-${{ github.run_id }}-${{ matrix.replicate }}
          path: ci-artifacts/freshness-redis-${{ github.run_id }}-${{ matrix.replicate }}/results.json
          retention-days: 30
          if-no-files-found: error
