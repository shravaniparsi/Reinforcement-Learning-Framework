name: Freshness Clustered-Loss Final Collection

on:
  workflow_dispatch:
    inputs:
      shard:
        description: Authorized final-collection shard
        required: true
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
          - "6"

permissions:
  contents: read

concurrency:
  group: freshness-clustered-loss-final-shard-${{ inputs.shard }}
  cancel-in-progress: false

jobs:
  prepare-matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.9.25'
      - name: Build the authorized shard matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          matrix="$(python scripts/build_clustered_loss_final_matrix.py --shard '${{ inputs.shard }}')"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

  final-blocks:
    needs: prepare-matrix
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    name: >-
      final-s${{ matrix.shard }}
      (${{ matrix.workload }}, ${{ matrix.regime }},
      ${{ matrix.transport }}, ${{ matrix.seed }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.9.25'
      - name: Install the calibrated Redis package
        run: |
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install --yes -o Acquire::Retries=5 \
            redis-server=5:7.0.15-1ubuntu0.24.04.5 \
            redis-tools=5:7.0.15-1ubuntu0.24.04.5
      - name: Verify final-study contracts
        run: |
          python -m unittest \
            tests.test_clustered_loss_final_protocol \
            tests.test_freshness_clustered_loss_final \
            tests.test_freshness_clustered_loss_design \
            tests.test_freshness_clustered_loss_measurement \
            tests.test_freshness_trace_generator \
            tests.test_freshness_trace_runner \
            tests.test_freshness_locked_execution \
            tests.test_freshness_measurement
      - name: Run matched final fault profiles with four frozen policies
        shell: bash
        run: |
          set -euo pipefail
          for profile in no-fault dispersed-10 single-burst-10 repeated-bursts-10; do
            output="ci-artifacts/${{ matrix.workload }}-${{ matrix.regime }}-${{ matrix.transport }}-${{ matrix.seed }}/${profile}"
            python -m experiments.freshness.run_clustered_loss_final_block \
              "${output}" \
              --stage extension-final \
              --workload "${{ matrix.workload }}" \
              --regime "${{ matrix.regime }}" \
              --fault-profile "${profile}" \
              --transport "${{ matrix.transport }}" \
              --seed "${{ matrix.seed }}"
          done
      - name: Upload retained final blocks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clustered-loss-final-s${{ matrix.shard }}-${{ matrix.workload }}-${{ matrix.regime }}-${{ matrix.transport }}-${{ matrix.seed }}-${{ github.run_id }}
          path: ci-artifacts/
          compression-level: 9
          retention-days: 60
          if-no-files-found: error
          overwrite: true
