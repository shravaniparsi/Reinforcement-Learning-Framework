name: Freshness Hosted Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freshness-hosted-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  allocation-block:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        workload:
          - mutable-product-v1
          - svelte-realworld-feed-v1
          - react-admin-dashboard-v1
        transport: [redis-pubsub, redis-streams]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.9.25'
      - name: Install the calibrated Redis package
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            redis-server=5:7.0.15-1ubuntu0.24.04.5 \
            redis-tools=5:7.0.15-1ubuntu0.24.04.5
          redis-server --version
      - name: Verify contracts
        run: |
          python -m unittest discover -s tests -p 'test_freshness_*.py'
      - name: Verify real Redis transport paths
        run: |
          python -m experiments.freshness.redis_calibration \
            "ci-artifacts/transport-${{ matrix.workload }}-${{ matrix.transport }}/results.json" \
            --warmup 10 \
            --samples 100
      - name: Run isolated policy allocation block
        run: |
          python -m experiments.freshness.run_hosted_preflight \
            "ci-artifacts/block-${{ matrix.workload }}-${{ matrix.transport }}" \
            --workload "${{ matrix.workload }}" \
            --transport "${{ matrix.transport }}"
      - name: Run integrated Redis instrumentation gate
        run: |
          python -m experiments.freshness.trace_generator \
            "ci-artifacts/integrated-${{ matrix.workload }}-${{ matrix.transport }}/schedule.json" \
            --workload "${{ matrix.workload }}" \
            --regime write-intensive \
            --partition engineering \
            --seed 0 \
            --fault-profile combined-stress \
            --transport "${{ matrix.transport }}"
          python -m experiments.freshness.run_instrumented_unit \
            "ci-artifacts/integrated-${{ matrix.workload }}-${{ matrix.transport }}/schedule.json" \
            fixed-ttl \
            "ci-artifacts/integrated-${{ matrix.workload }}-${{ matrix.transport }}/result.json" \
            --stage engineering
      - name: Upload retained preflight artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: freshness-preflight-${{ matrix.workload }}-${{ matrix.transport }}-${{ github.run_id }}
          path: ci-artifacts/
          retention-days: 30
          if-no-files-found: error
